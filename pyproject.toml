[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-pymupdf4llm>=1.28.0",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.4.2",
]
anthropic = [
    "langchain-anthropic>=1.5.4",
]
ollama = [
    "langchain-ollama>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resbot"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
